name: Sync Upstream & Rebuild Bilingual

env:
  UPSTREAM_REPO: maboloshi/github-chinese
  UPSTREAM_BRANCH: gh-pages
  MIRROR_BRANCH: gh-pages
  BILINGUAL_BRANCH: bilingual

on:
  schedule:
    - cron: "17 */6 * * *"

  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "即使上游无更新，也强制重建一次双语版（用于测试）"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: sync-upstream-bilingual
  cancel-in-progress: false

jobs:
  sync-and-rebuild:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout bilingual
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BILINGUAL_BRANCH }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and fetch
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream \
            "https://github.com/${UPSTREAM_REPO}.git"

          git fetch origin \
            "${MIRROR_BRANCH}" \
            "${BILINGUAL_BRANCH}"

          git fetch upstream \
            "${UPSTREAM_BRANCH}"

      - name: Detect upstream changes
        id: detect
        shell: bash
        run: |
          OLD="$(git rev-parse origin/${MIRROR_BRANCH})"
          NEW="$(git rev-parse upstream/${UPSTREAM_BRANCH})"

          echo "old=${OLD}" >> "$GITHUB_OUTPUT"
          echo "new=${NEW}" >> "$GITHUB_OUTPUT"

          if [ "$OLD" = "$NEW" ]; then
            echo "upstream_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "upstream_changed=true" >> "$GITHUB_OUTPUT"
          fi

          FORCE="${{ github.event_name == 'workflow_dispatch' && inputs.force_rebuild || false }}"
          echo "force=${FORCE}" >> "$GITHUB_OUTPUT"

          if [ "$OLD" != "$NEW" ]; then
            if git diff --quiet \
              "$OLD" \
              "$NEW" \
              -- main.user.js locals.js; then
              echo "core_changed=false" >> "$GITHUB_OUTPUT"
              echo "rebuild_needed=false" >> "$GITHUB_OUTPUT"
            else
              echo "core_changed=true" >> "$GITHUB_OUTPUT"
              echo "rebuild_needed=true" >> "$GITHUB_OUTPUT"
            fi
          elif [ "$FORCE" = "true" ]; then
            echo "core_changed=false" >> "$GITHUB_OUTPUT"
            echo "rebuild_needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "core_changed=false" >> "$GITHUB_OUTPUT"
            echo "rebuild_needed=false" >> "$GITHUB_OUTPUT"
          fi

          echo "旧上游镜像：$OLD"
          echo "最新上游：  $NEW"
          echo "核心文件变化：$(cat "$GITHUB_OUTPUT" | grep '^core_changed=' | tail -1 | cut -d= -f2-)"
          echo "强制重建：  $FORCE"

      - name: Nothing to do
        if: >
          steps.detect.outputs.upstream_changed != 'true' &&
          steps.detect.outputs.force != 'true'
        run: |
          echo "当前已与上游保持同步，无需处理。"
          echo "✅ 当前已与 upstream 保持同步。" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Verify mirror can fast-forward
        if: steps.detect.outputs.upstream_changed == 'true'
        run: |
          if ! git merge-base --is-ancestor \
            "origin/${MIRROR_BRANCH}" \
            "upstream/${UPSTREAM_BRANCH}"; then
            echo "::error::${MIRROR_BRANCH} 已偏离 upstream，自动同步停止。"
            exit 1
          fi

      - name: Save three-way merge inputs
        if: steps.detect.outputs.rebuild_needed == 'true'
        run: |
          OLD="${{ steps.detect.outputs.old }}"
          NEW="${{ steps.detect.outputs.new }}"

          cp main-bilingual.user.js \
            /tmp/current-bilingual.user.js

          git show "${OLD}:main.user.js" \
            > /tmp/base-main.user.js

          git show "${NEW}:main.user.js" \
            > /tmp/new-main.user.js

      - name: Prepare latest upstream mirror
        if: >
          steps.detect.outputs.upstream_changed == 'true' ||
          steps.detect.outputs.force == 'true'
        run: |
          git branch -f \
            "${MIRROR_BRANCH}" \
            "upstream/${UPSTREAM_BRANCH}"

      # 核心变化：
      # 不再把完整上游 merge 进 bilingual。
      # 只从最新上游提取真正需要的两个源文件。
      - name: Sync only required upstream files
        if: >
          steps.detect.outputs.upstream_changed == 'true' ||
          steps.detect.outputs.force == 'true'
        run: |
          NEW="${{ steps.detect.outputs.new }}"

          git show "${NEW}:main.user.js" \
            > main.user.js

          git show "${NEW}:locals.js" \
            > locals.js

      - name: Rebuild main-bilingual.user.js
        id: rebuild
        if: steps.detect.outputs.rebuild_needed == 'true'
        shell: bash
        run: |
          set -o pipefail

          node tools/rebuild-bilingual.mjs \
            --base /tmp/base-main.user.js \
            --upstream /tmp/new-main.user.js \
            --current /tmp/current-bilingual.user.js \
            --output main-bilingual.user.js \
            | tee /tmp/bilingual-build.log

          STATUS="$(
            grep '^BUILD_STATUS=' /tmp/bilingual-build.log \
            | tail -1 \
            | cut -d= -f2-
          )"

          VERSION="$(
            grep '^NEW_VERSION=' /tmp/bilingual-build.log \
            | tail -1 \
            | cut -d= -f2-
          )"

          UPSTREAM_VERSION="$(
            grep '^UPSTREAM_VERSION=' /tmp/bilingual-build.log \
            | tail -1 \
            | cut -d= -f2-
          )"

          test -n "$STATUS"
          test -n "$VERSION"

          echo "status=${STATUS}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "upstream_version=${UPSTREAM_VERSION}" \
            >> "$GITHUB_OUTPUT"

          if [ "$STATUS" = "fallback-ours" ]; then
            echo "::warning::上游与双语修改存在重叠，已自动优先保留双语冲突区。"
          fi

      - name: Final safety checks
        if: >
          steps.detect.outputs.upstream_changed == 'true' ||
          steps.detect.outputs.force == 'true'
        shell: bash
        run: |
          test -f main.user.js
          test -f locals.js
          test -f main-bilingual.user.js
          test -f tools/rebuild-bilingual.mjs

          node --check main.user.js
          node --check main-bilingual.user.js

          if grep -nE \
            '^(<<<<<<<|=======|>>>>>>>)' \
            main-bilingual.user.js; then
            echo "::error::发现未解决的 Git 冲突标记。"
            exit 1
          fi

          if ! grep -q \
            'raw.githubusercontent.com/xinxinenjoy/github-chinese/bilingual/locals.js' \
            main-bilingual.user.js; then
            echo "::error::双语脚本没有正确引用 bilingual/locals.js。"
            exit 1
          fi

          # bilingual 自动任务只允许修改这三个产品文件。
          UNEXPECTED="$(
            git diff --name-only \
            | grep -vE '^(main\.user\.js|locals\.js|main-bilingual\.user\.js)$' \
            || true
          )"

          if [ -n "$UNEXPECTED" ]; then
            echo "::error::发现预期之外的文件变化："
            echo "$UNEXPECTED"
            exit 1
          fi

      - name: Commit bilingual changes
        if: >
          steps.detect.outputs.upstream_changed == 'true' ||
          steps.detect.outputs.force == 'true'
        shell: bash
        run: |
          # 只提交产品层允许自动维护的三个文件。
          git add \
            main.user.js \
            locals.js \
            main-bilingual.user.js

          if git diff --cached --quiet; then
            echo "bilingual 没有需要提交的核心文件变化。"
            exit 0
          fi

          VERSION="${{ steps.rebuild.outputs.version }}"

          if [ -n "$VERSION" ]; then
            MESSAGE="自动同步核心文件并重建双语脚本 ${VERSION}"
          else
            MESSAGE="自动同步上游核心文件"
          fi

          git commit -m "$MESSAGE"

      - name: Push mirror and bilingual atomically
        if: >
          steps.detect.outputs.upstream_changed == 'true' ||
          steps.detect.outputs.force == 'true'
        run: |
          git push --atomic \
            origin \
            "${MIRROR_BRANCH}:${MIRROR_BRANCH}" \
            "${BILINGUAL_BRANCH}:${BILINGUAL_BRANCH}"

      - name: Build summary
        if: >
          steps.detect.outputs.upstream_changed == 'true' ||
          steps.detect.outputs.force == 'true'
        shell: bash
        run: |
          {
            echo "## GitHub 中英双语自动维护"
            echo
            echo "- 上游旧提交：\`${{ steps.detect.outputs.old }}\`"
            echo "- 上游新提交：\`${{ steps.detect.outputs.new }}\`"
            echo "- 上游是否更新：\`${{ steps.detect.outputs.upstream_changed }}\`"
            echo "- 核心文件是否变化：\`${{ steps.detect.outputs.core_changed }}\`"
            echo "- 是否重建双语脚本：\`${{ steps.detect.outputs.rebuild_needed }}\`"
            echo
            echo "### bilingual 自动维护范围"
            echo "- \`main.user.js\`"
            echo "- \`locals.js\`"
            echo "- \`main-bilingual.user.js\`"

            if [ -n "${{ steps.rebuild.outputs.version }}" ]; then
              echo
              echo "- 新双语版本：\`${{ steps.rebuild.outputs.version }}\`"
              echo "- 合并方式：\`${{ steps.rebuild.outputs.status }}\`"
            fi

            if [ "${{ steps.rebuild.outputs.status }}" = "fallback-ours" ]; then
              echo
              echo "⚠️ 上游与双语修改发生重叠。"
              echo "已保留双语冲突区，并吸收其他非冲突上游修改。"
            else
              echo
              echo "✅ 自动同步/维护完成。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
