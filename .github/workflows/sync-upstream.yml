name: Sync Upstream & Rebuild Bilingual

env:
  UPSTREAM_REPO: maboloshi/github-chinese
  UPSTREAM_BRANCH: gh-pages
  MIRROR_BRANCH: gh-pages
  BILINGUAL_BRANCH: bilingual

on:
  schedule:
    # 上游 main.user.js 的固定周度任务：
    # UTC 周日 16:00 = 北京时间周一 00:00
    # 留出约 47 分钟给上游任务执行，并避开整点高峰。
    - cron: "47 16 * * 0"

    # 平日轻量兜底检查：
    # UTC 01:37 = 北京时间 09:37
    # 只比较远程 SHA；无变化时不会 checkout / rebuild。
    - cron: "37 1,13 * * *"

  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "即使上游无更新，也强制重建一次双语版（用于测试）"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: sync-upstream-bilingual
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------------
  # 第一层：超轻量检查
  #
  # 平时只通过 git ls-remote 比较两个远程分支的 SHA。
  # 如果完全一致，这次 Actions 到这里就结束。
  # ----------------------------------------------------------
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    outputs:
      old: ${{ steps.probe.outputs.old }}
      new: ${{ steps.probe.outputs.new }}
      run_full: ${{ steps.probe.outputs.run_full }}
      reason: ${{ steps.probe.outputs.reason }}

    steps:
      - name: Lightweight upstream check
        id: probe
        shell: bash
        run: |
          set -euo pipefail

          OLD="$(
            git ls-remote \
              "https://github.com/${GITHUB_REPOSITORY}.git" \
              "refs/heads/${MIRROR_BRANCH}" \
            | awk '{print $1}'
          )"

          NEW="$(
            git ls-remote \
              "https://github.com/${UPSTREAM_REPO}.git" \
              "refs/heads/${UPSTREAM_BRANCH}" \
            | awk '{print $1}'
          )"

          if [ -z "$OLD" ]; then
            echo "::error::无法读取本仓库 ${MIRROR_BRANCH} 分支。"
            exit 1
          fi

          if [ -z "$NEW" ]; then
            echo "::error::无法读取上游 ${UPSTREAM_BRANCH} 分支。"
            exit 1
          fi

          FORCE="${{ github.event_name == 'workflow_dispatch' && inputs.force_rebuild || false }}"

          echo "old=${OLD}" >> "$GITHUB_OUTPUT"
          echo "new=${NEW}" >> "$GITHUB_OUTPUT"

          if [ "$FORCE" = "true" ]; then
            echo "run_full=true" >> "$GITHUB_OUTPUT"
            echo "reason=force-rebuild" >> "$GITHUB_OUTPUT"
          elif [ "$OLD" != "$NEW" ]; then
            echo "run_full=true" >> "$GITHUB_OUTPUT"
            echo "reason=upstream-changed" >> "$GITHUB_OUTPUT"
          else
            echo "run_full=false" >> "$GITHUB_OUTPUT"
            echo "reason=no-change" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "## 上游轻量检查"
            echo
            echo "- 本仓库镜像：\`${OLD}\`"
            echo "- 上游最新版：\`${NEW}\`"

            if [ "$FORCE" = "true" ]; then
              echo "- 结果：🧪 手动要求强制重建"
            elif [ "$OLD" != "$NEW" ]; then
              echo "- 结果：🔄 发现上游变化，将启动完整同步"
            else
              echo "- 结果：✅ SHA 一致，无需进一步处理"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ----------------------------------------------------------
  # 第二层：只有上游变化 / 手动强制时才运行
  # ----------------------------------------------------------
  sync-and-rebuild:
    needs: probe
    if: needs.probe.outputs.run_full == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout bilingual
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BILINGUAL_BRANCH }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and fetch
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream \
            "https://github.com/${UPSTREAM_REPO}.git"

          git fetch origin \
            "${MIRROR_BRANCH}" \
            "${BILINGUAL_BRANCH}"

          git fetch upstream \
            "${UPSTREAM_BRANCH}"

      - name: Detect exact upstream changes
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          OLD="$(git rev-parse origin/${MIRROR_BRANCH})"
          NEW="$(git rev-parse upstream/${UPSTREAM_BRANCH})"

          echo "old=${OLD}" >> "$GITHUB_OUTPUT"
          echo "new=${NEW}" >> "$GITHUB_OUTPUT"

          if [ "$OLD" = "$NEW" ]; then
            echo "upstream_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "upstream_changed=true" >> "$GITHUB_OUTPUT"
          fi

          FORCE="${{ github.event_name == 'workflow_dispatch' && inputs.force_rebuild || false }}"
          echo "force=${FORCE}" >> "$GITHUB_OUTPUT"

          if [ "$OLD" != "$NEW" ]; then
            if git diff --quiet \
              "$OLD" \
              "$NEW" \
              -- main.user.js locals.js; then
              echo "core_changed=false" >> "$GITHUB_OUTPUT"
              echo "rebuild_needed=false" >> "$GITHUB_OUTPUT"
            else
              echo "core_changed=true" >> "$GITHUB_OUTPUT"
              echo "rebuild_needed=true" >> "$GITHUB_OUTPUT"
            fi

            if git diff --quiet \
              "$OLD" \
              "$NEW" \
              -- README.md; then
              echo "readme_changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "readme_changed=true" >> "$GITHUB_OUTPUT"
            fi
          elif [ "$FORCE" = "true" ]; then
            echo "core_changed=false" >> "$GITHUB_OUTPUT"
            echo "readme_changed=false" >> "$GITHUB_OUTPUT"
            echo "rebuild_needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "core_changed=false" >> "$GITHUB_OUTPUT"
            echo "readme_changed=false" >> "$GITHUB_OUTPUT"
            echo "rebuild_needed=false" >> "$GITHUB_OUTPUT"
          fi

          echo "旧上游镜像：$OLD"
          echo "最新上游：  $NEW"
          echo "强制重建：  $FORCE"

      # 上游分支如果发生 force-push / 历史回退，不允许自动跟随。
      - name: Verify mirror can fast-forward
        if: steps.detect.outputs.upstream_changed == 'true'
        run: |
          if ! git merge-base --is-ancestor \
            "origin/${MIRROR_BRANCH}" \
            "upstream/${UPSTREAM_BRANCH}"; then
            echo "::error::检测到上游历史回退或分支改写，自动同步停止。"
            echo "::error::请人工确认 upstream/${UPSTREAM_BRANCH} 后再处理。"
            exit 1
          fi

      # 正常的新提交即使把版本号改低，也视为上游主动回退并继续跟随。
      # 这里只记录 Warning，不阻断同步。真正的历史改写仍由上一阶段拦截。
      - name: Observe upstream version rollback
        id: version_check
        if: steps.detect.outputs.upstream_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          OLD="${{ steps.detect.outputs.old }}"
          NEW="${{ steps.detect.outputs.new }}"

          OLD_VERSION="$(
            git show "${OLD}:main.user.js" \
            | sed -n -E 's/^\/\/ @version[[:space:]]+(.+)/\1/p' \
            | head -1
          )"

          NEW_VERSION="$(
            git show "${NEW}:main.user.js" \
            | sed -n -E 's/^\/\/ @version[[:space:]]+(.+)/\1/p' \
            | head -1
          )"

          echo "old_version=${OLD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "rollback=false" >> "$GITHUB_OUTPUT"

          echo "当前镜像版本：${OLD_VERSION:-未知}"
          echo "最新上游版本：${NEW_VERSION:-未知}"

          if [ -n "$OLD_VERSION" ] && \
             [ -n "$NEW_VERSION" ] && \
             [ "$OLD_VERSION" != "$NEW_VERSION" ]; then

            LOWEST="$(
              printf '%s\n%s\n' \
                "$OLD_VERSION" \
                "$NEW_VERSION" \
              | sort -V \
              | head -1
            )"

            if [ "$LOWEST" = "$NEW_VERSION" ]; then
              echo "rollback=true" >> "$GITHUB_OUTPUT"
              echo "::warning::检测到上游版本号降低：${OLD_VERSION} → ${NEW_VERSION}"
              echo "::warning::Git 历史仍正常向前，因此按上游主动回退处理并继续同步。"
            fi
          fi

      - name: Save three-way merge inputs
        if: steps.detect.outputs.rebuild_needed == 'true'
        run: |
          OLD="${{ steps.detect.outputs.old }}"
          NEW="${{ steps.detect.outputs.new }}"

          cp main-bilingual.user.js \
            /tmp/current-bilingual.user.js

          git show "${OLD}:main.user.js" \
            > /tmp/base-main.user.js

          git show "${NEW}:main.user.js" \
            > /tmp/new-main.user.js

      - name: Prepare latest upstream mirror
        run: |
          git branch -f \
            "${MIRROR_BRANCH}" \
            "upstream/${UPSTREAM_BRANCH}"

      # bilingual 不再 merge 整个上游，只提取运行所需的核心文件。
      - name: Sync required upstream files
        run: |
          NEW="${{ steps.detect.outputs.new }}"

          git show "${NEW}:main.user.js" \
            > main.user.js

          git show "${NEW}:locals.js" \
            > locals.js

      - name: Rebuild main-bilingual.user.js
        id: rebuild
        if: steps.detect.outputs.rebuild_needed == 'true'
        shell: bash
        run: |
          set -o pipefail

          node tools/rebuild-bilingual.mjs \
            --base /tmp/base-main.user.js \
            --upstream /tmp/new-main.user.js \
            --current /tmp/current-bilingual.user.js \
            --output main-bilingual.user.js \
            | tee /tmp/bilingual-build.log

          STATUS="$(
            grep '^BUILD_STATUS=' /tmp/bilingual-build.log \
            | tail -1 \
            | cut -d= -f2-
          )"

          VERSION="$(
            grep '^NEW_VERSION=' /tmp/bilingual-build.log \
            | tail -1 \
            | cut -d= -f2-
          )"

          UPSTREAM_VERSION="$(
            grep '^UPSTREAM_VERSION=' /tmp/bilingual-build.log \
            | tail -1 \
            | cut -d= -f2-
          )"

          RELEASE_CORE_VERSION="$(
            grep '^RELEASE_CORE_VERSION=' /tmp/bilingual-build.log \
            | tail -1 \
            | cut -d= -f2-
          )"

          VERSION_CORE_HELD="$(
            grep '^VERSION_CORE_HELD=' /tmp/bilingual-build.log \
            | tail -1 \
            | cut -d= -f2-
          )"

          test -n "$STATUS"
          test -n "$VERSION"
          test -n "$RELEASE_CORE_VERSION"
          test -n "$VERSION_CORE_HELD"

          echo "status=${STATUS}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "upstream_version=${UPSTREAM_VERSION}" \
            >> "$GITHUB_OUTPUT"
          echo "release_core_version=${RELEASE_CORE_VERSION}" \
            >> "$GITHUB_OUTPUT"
          echo "version_core_held=${VERSION_CORE_HELD}" \
            >> "$GITHUB_OUTPUT"

          if [ "$VERSION_CORE_HELD" = "true" ]; then
            echo "::warning::上游代码已按正常提交回退，但双语脚本发布版本号保持单调递增。"
          fi

          if [ "$STATUS" = "fallback-ours" ]; then
            echo "::warning::上游与双语修改存在重叠，已自动优先保留双语冲突区。"
          fi

      # README 不再手工复制一份后长期失去更新。
      # 每次完整同步时都以最新上游 README 为主体，
      # 再叠加 .github/README-bilingual.md 中属于本仓库的说明。
      - name: Rebuild README from upstream
        shell: bash
        run: |
          NEW="${{ steps.detect.outputs.new }}"

          git show "${NEW}:README.md" \
            > /tmp/upstream-README.md

          python3 <<'PY'
          from pathlib import Path

          upstream = Path("/tmp/upstream-README.md").read_text(encoding="utf-8")
          custom = Path(".github/README-bilingual.md").read_text(encoding="utf-8")

          # bilingual 分支已经瘦身，原 README 中少数相对路径需要指回上游。
          upstream = upstream.replace(
              "(./README_zh-TW.md)",
              "(https://github.com/maboloshi/github-chinese/blob/gh-pages/README_zh-TW.md)",
          )
          upstream = upstream.replace(
              "(vscode-extension/README.md)",
              "(https://github.com/maboloshi/github-chinese/blob/gh-pages/vscode-extension/README.md)",
          )

          marker = "<!-- BILINGUAL_APPENDIX -->"
          if marker not in custom:
              raise SystemExit(
                  ".github/README-bilingual.md 缺少 BILINGUAL_APPENDIX 标记"
              )

          notice, appendix = custom.split(marker, 1)

          output = (
              notice.strip()
              + "\n\n---\n\n"
              + upstream.strip()
              + "\n\n---\n\n"
              + appendix.strip()
              + "\n"
          )

          Path("README.md").write_text(output, encoding="utf-8")
          PY

      - name: Final safety checks
        shell: bash
        run: |
          test -f main.user.js
          test -f locals.js
          test -f main-bilingual.user.js
          test -f tools/rebuild-bilingual.mjs
          test -f .github/README-bilingual.md
          test -f README.md

          node --check main.user.js
          node --check main-bilingual.user.js

          if grep -nE \
            '^(<<<<<<<|=======|>>>>>>>)' \
            main-bilingual.user.js; then
            echo "::error::发现未解决的 Git 冲突标记。"
            exit 1
          fi

          if ! grep -q \
            'raw.githubusercontent.com/xinxinenjoy/github-chinese/bilingual/locals.js' \
            main-bilingual.user.js; then
            echo "::error::双语脚本没有正确引用 bilingual/locals.js。"
            exit 1
          fi

          # 自动任务只允许修改这四个生成 / 同步文件。
          UNEXPECTED="$(
            git diff --name-only \
            | grep -vE \
              '^(main\.user\.js|locals\.js|main-bilingual\.user\.js|README\.md)$' \
            || true
          )"

          if [ -n "$UNEXPECTED" ]; then
            echo "::error::发现预期之外的文件变化："
            echo "$UNEXPECTED"
            exit 1
          fi

      - name: Commit bilingual changes
        shell: bash
        run: |
          git add \
            main.user.js \
            locals.js \
            main-bilingual.user.js \
            README.md

          if git diff --cached --quiet; then
            echo "bilingual 没有需要提交的变化。"
            exit 0
          fi

          VERSION="${{ steps.rebuild.outputs.version }}"

          if [ -n "$VERSION" ]; then
            MESSAGE="自动同步上游并重建双语脚本 ${VERSION}"
          else
            MESSAGE="自动同步上游内容"
          fi

          git commit -m "$MESSAGE"

      - name: Push mirror and bilingual atomically
        run: |
          git push --atomic \
            origin \
            "${MIRROR_BRANCH}:${MIRROR_BRANCH}" \
            "${BILINGUAL_BRANCH}:${BILINGUAL_BRANCH}"

      - name: Build summary
        shell: bash
        run: |
          {
            echo "## GitHub 中英双语自动维护"
            echo
            echo "- 上游旧提交：\`${{ steps.detect.outputs.old }}\`"
            echo "- 上游新提交：\`${{ steps.detect.outputs.new }}\`"
            echo "- 上游是否更新：\`${{ steps.detect.outputs.upstream_changed }}\`"
            echo "- 核心文件是否变化：\`${{ steps.detect.outputs.core_changed }}\`"
            echo "- README 是否变化：\`${{ steps.detect.outputs.readme_changed }}\`"
            echo "- 是否重建双语脚本：\`${{ steps.detect.outputs.rebuild_needed }}\`"
            echo "- 上游版本号是否降低：\`${{ steps.version_check.outputs.rollback || 'false' }}\`"

            if [ -n "${{ steps.rebuild.outputs.version }}" ]; then
              echo "- 新双语版本：\`${{ steps.rebuild.outputs.version }}\`"
              echo "- 双语发布核心版本：\`${{ steps.rebuild.outputs.release_core_version }}\`"
              echo "- 是否因上游回退保留较高发布核心版本：\`${{ steps.rebuild.outputs.version_core_held }}\`"
              echo "- 合并方式：\`${{ steps.rebuild.outputs.status }}\`"
            fi

            echo
            echo "### 自动维护范围"
            echo "- \`main.user.js\`"
            echo "- \`locals.js\`"
            echo "- \`main-bilingual.user.js\`"
            echo "- \`README.md\`（上游主体 + 本仓库说明）"

            if [ "${{ steps.rebuild.outputs.status }}" = "fallback-ours" ]; then
              echo
              echo "⚠️ 上游与双语修改发生重叠。"
              echo "已保留双语冲突区，并吸收其他非冲突上游修改。"
            else
              echo
              echo "✅ 自动同步 / 维护完成。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
